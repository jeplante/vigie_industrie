sources:
  - id: mfc-results
    companyId: MFC
    contentCategory: financial_results
    type: html_release_index
    url: https://www.newswire.ca/search/news/?keyword=Manulife%20Reports
    adapter: manulife
    priority: primary
    language: fr
    enabled: true
    timeoutSeconds: 20
    attempts: 3
    expectedMetrics:
      [core_eps, core_earnings, net_income, core_roe, licat_ratio]
    requiredMetrics:
      [core_eps, core_earnings, net_income, core_roe, licat_ratio]
    fetchPolicy: etag_last_modified_then_hash
    archiveUrlTemplate: https://www.newswire.ca/news/manulife-financial-corporation/?page={page}
    archivePages: 10
    historicalDocumentUrls:
      - https://www.newswire.ca/news-releases/manulife-reports-third-quarter-2024-results-850565610.html
      - https://www.newswire.ca/news-releases/manulife-reports-2022-net-income-of-7-3-billion-core-earnings-of-6-2-billion-remittances-of-6-9-billion-and-a-dividend-increase-of-11--807038913.html
  - id: slf-results
