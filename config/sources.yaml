sources:
  - id: mfc-results
    companyId: MFC
    contentCategory: financial_results
    type: html_release_index
    url: https://www.newswire.ca/search/news/?keyword=Manulife%20Reports
    adapter: manulife
    priority: primary
    language: fr
    enabled: true
    timeoutSeconds: 20
    attempts: 3
    expectedMetrics: [core_eps, core_earnings, net_income, licat_ratio]
    fetchPolicy: etag_last_modified_then_hash
  - id: slf-results
    companyId: SLF
    contentCategory: financial_results
    type: html_release_index
    url: https://www.newswire.ca/search/news/?keyword=Sun%20Life%20Reports
    adapter: sunlife
    priority: primary
    language: en
    enabled: true
    timeoutSeconds: 20
    attempts: 3
    expectedMetrics: [core_eps, net_income, licat_ratio, assets_under_management]
    fetchPolicy: etag_last_modified_then_hash
  - id: gwo-results
    companyId: GWO
    contentCategory: financial_results
    type: html_release_index
    url: https://www.greatwestlifeco.com/investor-relations/financial-reports.html
    adapter: great_west
    priority: primary
    language: en
    enabled: true
    timeoutSeconds: 20
    attempts: 3
    expectedMetrics: [core_eps, core_earnings, licat_ratio, total_client_assets]
    fetchPolicy: etag_last_modified_then_hash
    documentUrlTemplate: https://www.greatwestlifeco.com/content/dam/lifeco/documents/investor-relations/reports/{year}/q{quarter}/lifeco-q{quarter}-{year}-quarterly-report-to-shareholders-en.pdf
  - id: iag-results
    companyId: IAG
    contentCategory: financial_results
    type: html_release_index
    url: https://ia.ca/investorrelations
    adapter: ia
    priority: primary
    language: fr
    enabled: true
    timeoutSeconds: 20
    attempts: 3
    expectedMetrics: [core_eps, core_earnings, solvency_ratio, assets_under_administration]
    fetchPolicy: etag_last_modified_then_hash
  - id: mfc-official-news
    companyId: MFC
    contentCategory: official_news
    type: html_news_index
    url: https://www.newswire.ca/news/manulife-financial-corporation/
    adapter: generic_news
    priority: official_release
    language: en
    enabled: true
    required: false
    timeoutSeconds: 20
    attempts: 3
    expectedMetrics: []
    fetchPolicy: canonical_url_then_hash
    linkSelector: a[href*='/news-releases/'][href$='.html']
    articleSelector: article, main
    includePatterns: []
    maxArticles: 8
  - id: slf-official-news
    companyId: SLF
    contentCategory: official_news
    type: html_news_index
    url: https://www.newswire.ca/news/sun-life-financial-inc.-__-financial-news/
    adapter: generic_news
    priority: official_release
    language: en
    enabled: true
    required: false
    timeoutSeconds: 20
    attempts: 3
    expectedMetrics: []
    fetchPolicy: canonical_url_then_hash
    linkSelector: a[href*='/news-releases/'][href$='.html'], a[href*='/en/newsroom/news-releases/announcement/']
    articleSelector: article, main
    includePatterns: []
    maxArticles: 8
  - id: gwo-official-news
    companyId: GWO
    contentCategory: official_news
    type: html_news_index
    url: https://www.newswire.ca/news/great__west-lifeco-inc./
    adapter: generic_news
    priority: official_release
    language: en
    enabled: true
    required: false
    timeoutSeconds: 20
    attempts: 3
    expectedMetrics: []
    fetchPolicy: canonical_url_then_hash
    linkSelector: a[href*='/news-releases/'][href$='.html']
    articleSelector: article, main
    includePatterns: []
    maxArticles: 8
  - id: iag-official-news
    companyId: IAG
    contentCategory: official_news
    type: html_news_index
    url: https://ia.ca/newsroom
    adapter: ia_news
    priority: official_release
    language: fr
    enabled: true
    required: false
    timeoutSeconds: 20
    attempts: 3
    expectedMetrics: []
    fetchPolicy: canonical_url_then_hash
    linkSelector: a[href]
    articleSelector: article, main
    includePatterns: [/newsroom/, /salle-de-presse/]
