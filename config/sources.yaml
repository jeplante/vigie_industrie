    archivePages: 4
    historicalDocumentUrls:
      - https://www.newswire.ca/news-releases/sun-life-reports-first-quarter-2022-results-873365295.html
      - https://www.newswire.ca/news-releases/sun-life-reports-second-quarter-2022-results-852333279.html
  - id: gwo-results
    companyId: GWO
    contentCategory: financial_results
    type: html_release_index
    url: https://www.greatwestlifeco.com/investor-relations/financial-reports.html
    adapter: great_west
    priority: primary
    language: en
    enabled: true
    timeoutSeconds: 20
    attempts: 3
    expectedMetrics:
      [
        core_eps,
        core_earnings,
        net_income,
        core_roe,
        licat_ratio,
        total_client_assets,
      ]
    requiredMetrics: [core_eps, core_earnings, core_roe, licat_ratio]
    historicalPeriodTypes: [quarter]
    fetchPolicy: etag_last_modified_then_hash
    documentUrlTemplate: https://www.greatwestlifeco.com/content/dam/lifeco/documents/investor-relations/reports/{year}/q{quarter}/lifeco-q{quarter}-{year}-quarterly-report-to-shareholders-en.pdf
    historicalDocumentUrls:
      - https://www.greatwestlifeco.com/news-and-events/news/2025/lifeco-q4-2024-earnings-release.html
      - https://www.greatwestlifeco.com/news-events/news/great-west-lifeco-reports-fourth-quarter-2023-results.html
      - https://www.greatwestlifeco.com/content/dam/lifeco/documents/investor-relations/reports/2023/q1/lifeco--q1-2023-quarterly-report-to-shareholders-en.pdf
      - https://www.greatwestlifeco.com/news-events/news/great-west-lifeco-reports-fourth-quarter-2022-results.html
