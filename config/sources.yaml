    priority: primary
    language: en
    enabled: true
    timeoutSeconds: 20
    attempts: 3
    expectedMetrics:
      [
        core_eps,
        core_earnings,
        net_income,
        core_roe,
        licat_ratio,
        assets_under_management,
      ]
    requiredMetrics: [core_eps, core_earnings, core_roe, licat_ratio]
    fetchPolicy: etag_last_modified_then_hash
